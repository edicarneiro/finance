spring.application.name=financepulse-engine
# "dev" é o único perfil existente hoje (não há deploy de produção configurado) — ativo por padrão para
# que `mvn spring-boot:run`/`./mvnw spring-boot:run` funcione sem flags extras. Ver application-dev.properties.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

financepulse.jwt.secret=${FINANCEPULSE_JWT_SECRET:change-me-in-production}

financepulse.cors.allowed-origins=${FINANCEPULSE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
