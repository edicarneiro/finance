spring.application.name=financepulse-engine

spring.datasource.url=jdbc:h2:file:./financepulse-java;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

financepulse.jwt.secret=${FINANCEPULSE_JWT_SECRET:change-me-in-production}
